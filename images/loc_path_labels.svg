<svg width="1072" height="208" viewBox="0 0 1072 208" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #1d252c; text-anchor: middle; }
    .hub-time { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 500; letter-spacing: 1.2px; fill: #7c7267; text-anchor: middle; }
    .hub-flagship { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 2px; fill: #8a6d3b; text-anchor: middle; }
    .hub-badge { fill: #f3efe9; stroke: #c4a57b; stroke-width: 1; }
  </style>

  <!-- AIIMS Bathinda -->
  <text x="60" y="172" class="hub-title">AIIMS BATHINDA</text>
  <text x="60" y="187" class="hub-time">5 MIN</text>

  <!-- Ring Road -->
  <text x="240" y="85" class="hub-title">RING ROAD</text>
  <text x="240" y="99" class="hub-time">2 MIN</text>

  <!-- Dream Heights Flagship -->
  <rect x="340" y="24" width="200" height="26" rx="4" class="hub-badge" />
  <text x="440" y="41" class="hub-flagship">★ DREAM HEIGHTS</text>
  <text x="440" y="56" class="hub-time">GATEWAY</text>

  <!-- City Center Mall -->
  <text x="640" y="145" class="hub-title">CITY CENTER MALL</text>
  <text x="640" y="160" class="hub-time">8 MIN</text>

  <!-- Bathinda Junction -->
  <text x="840" y="52" class="hub-title">BATHINDA JUNCTION</text>
  <text x="840" y="66" class="hub-time">10 MIN</text>

  <!-- Bathinda Airport -->
  <text x="1010" y="165" class="hub-title">BATHINDA AIRPORT</text>
  <text x="1010" y="180" class="hub-time">20 MIN</text>
</svg>