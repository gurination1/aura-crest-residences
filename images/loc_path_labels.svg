<svg width="1072" height="208" viewBox="0 0 1072 208" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #1d252c; text-anchor: middle; }
    .hub-time { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 500; letter-spacing: 1.2px; fill: #7c7267; text-anchor: middle; }
    .hub-flagship { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 2px; fill: #8a6d3b; text-anchor: middle; }
    .hub-badge { fill: #f3efe9; stroke: #c4a57b; stroke-width: 1; }
  </style>

  <!-- Bhagsunag Waterfall Trail -->
  <text x="80" y="164" class="hub-title">BHAGSUNAG</text>
  <text x="80" y="177" class="hub-title">WATERFALL TRAIL</text>
  <text x="80" y="192" class="hub-time">8 MIN</text>

  <!-- McLeod Ganj Main Square -->
  <text x="240" y="85" class="hub-title">MCLEOD GANJ MAIN SQUARE</text>
  <text x="240" y="99" class="hub-time">5 MIN</text>

  <!-- Aura Crest Flagship -->
  <rect x="330" y="24" width="220" height="26" rx="4" class="hub-badge" />
  <text x="440" y="41" class="hub-flagship">★ AURA CREST</text>
  <text x="440" y="56" class="hub-time">DHARAMKOT RIDGE</text>

  <!-- Dharamshala Skyway -->
  <text x="640" y="145" class="hub-title">DHARAMSHALA SKYWAY</text>
  <text x="640" y="160" class="hub-time">12 MIN</text>

  <!-- Kangra Airport DHM -->
  <text x="840" y="52" class="hub-title">KANGRA AIRPORT (DHM)</text>
  <text x="840" y="66" class="hub-time">35 MIN</text>

  <!-- Pathankot Cantt Junction -->
  <text x="985" y="164" class="hub-title">PATHANKOT CANTT</text>
  <text x="985" y="177" class="hub-title">JUNCTION</text>
  <text x="985" y="192" class="hub-time">2.5 HR</text>
</svg>